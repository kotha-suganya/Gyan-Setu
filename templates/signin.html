<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign In - Gyan Setu</title>
<link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=Nunito:wght@400;700&family=Poppins:wght@700&display=swap" rel="stylesheet" />
<style>
:root {
    --primary: #6C63FF;
    --secondary: #FF6584;
    --accent: #57E2A0; 
    --soft: #FFE6E6;
    --dark: #22223B; 
    --text: #343459;
    --error: #dc3545;
    --success: #28a745;
    --video-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
    --card-gradient: linear-gradient(120deg, #FCF6FF 60%, #D6FCFF 100%);
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
    --blossom-color: #FF69B4;
    --logoblue: #3B5998;
    --tagline-green: #2E8B57;
}
* {margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body {
    font-family: 'Nunito',sans-serif;
    background: var(--video-gradient);
    color: var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}
.form-wrapper {width:100%;max-width:450px;margin:0 auto;}
.card {border:none;border-radius:15px;background:var(--card-gradient);box-shadow:var(--shadow);overflow:hidden;width:100%;}
.card-body {padding:2rem !important;}
h2 {font-family:'Poppins',sans-serif;font-weight:700;color:var(--logoblue);text-shadow:1px 1px 2px rgba(0,0,0,0.05);margin-bottom:2rem;text-align:center;}
.form-label {font-weight:600;color:var(--text);margin-bottom:0.5rem;display:block;}
.form-control {border:1px solid #dedff0;border-radius:8px;padding:12px 15px;background-color:white;color:var(--dark);font-size:14px;transition:all 0.2s ease;width:100%;}
.form-control:focus {border-color:var(--primary);box-shadow:0 0 0 0.25rem rgba(108,99,255,0.25);background-color:#fefefe;outline:none;}
.form-control.is-invalid {border-color:var(--error);background-color:#fff5f5;}
.form-control.is-invalid:focus {border-color:var(--error);box-shadow:0 0 0 0.25rem rgba(220,53,69,0.25);}
.form-control.is-valid {border-color:var(--success);background-color:#f0fff4;}
.form-control.is-valid:focus {border-color:var(--success);box-shadow:0 0 0 0.25rem rgba(40,167,69,0.25);}
.error-message {color:var(--error);font-size:12px;font-weight:500;margin-top:5px;min-height:16px;line-height:1.2;}
.success-message {color:var(--success);font-size:12px;font-weight:500;margin-top:5px;min-height:16px;line-height:1.2;}
.btn-primary {background:linear-gradient(to right,var(--primary),var(--secondary));border:none;border-radius:30px;padding:12px 20px;font-weight:bold;font-size:16px;transition:all 0.3s ease;width:100%;color:white;}
.btn-primary:hover {background:linear-gradient(to left,var(--secondary),var(--primary));box-shadow:0 4px 12px rgba(108,99,255,0.3);transform:translateY(-1px);}
.btn-primary:disabled {background:#6c757d;cursor:not-allowed;transform:none;}
.text-center a {color:var(--secondary);font-weight:700;text-decoration:none;transition:all 0.2s;cursor:pointer;}
.text-center a:hover {color:var(--primary);text-decoration:underline;}
.password-field {position:relative;}
.password-toggle {position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--primary);font-size:1.1rem;transition:color 0.2s;}
.password-toggle:hover {color:var(--secondary);}
.form-check {margin:1rem 0;}
.form-check-input:checked {background-color:var(--primary);border-color:var(--primary);}
.form-check-label {color:var(--text);font-size:14px;}
.forgot-password-link {display:block;text-align:center;margin-top:1rem;font-size:14px;}
.username-helper {font-size:11px;color:#6c757d;margin-top:3px;font-style:italic;}

.logo .blossom{font-size:2.4rem;margin:0 10px;color:var(--blossom-color);animation:blossomPulse 2.5s infinite ease-in-out;}

.tagline{margin-top:6px;font-size:1rem;color:var(--tagline-green);letter-spacing:0.8px;font-family:'Quicksand',sans-serif;font-style:italic;} */
@media (max-width: 480px) {
            .form-wrapper {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            border: none;
            border-radius: 15px;
            background: var(--card-gradient);
            box-shadow: var(--shadow);
            overflow: hidden;
            width: 100%;
        }

            
            .card-body {
                padding: 2rem !important;
            }

            .password-requirements {
                font-size: 11px;
            }

            .toast {
                right: 10px;
                left: 10px;
                max-width: none;
                transform: translateY(-100px);
            }

            .toast.show {
                transform: translateY(0);
            }

            .toast.hide {
                transform: translateY(-100px);
            }
        }

        @media (max-height: 800px) {
            body {
                align-items: flex-start;
                padding-top: 40px;
            }
        }
        header {
    padding: 30px;
    /* Remove any old centering methods */
    text-align: center; 
    margin-bottom: 36px;
    position: relative;
    
    /* NEW: Use Flexbox to ensure centering regardless of child element type */
    display: flex;
    flex-direction: column; /* Stack the logo and tagline vertically */
    align-items: center;    /* KEY: Centers all children horizontally */
}

.logo {
    font-family: 'Poppins', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--logoblue);
    letter-spacing: 2px;
    user-select: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    animation: moveUpDown 3s ease-in-out infinite;
    /* KEY FIX: Prevents "Gyan Setuu" from breaking onto two lines */
    white-space: nowrap; 
}

.logo .blossom {
    /* Slightly increased size to match the image's prominence */
    font-size: 2.6rem; 
    margin: 0 10px;
    color: var(--blossom-color);
    animation: blossomPulse 2.5s infinite ease-in-out;
    user-select: none;
}

        @keyframes blossomPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        @keyframes moveUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .tagline {
    /* Reduces the margin for a tighter stack with the logo */
    margin-top: 8px; 
    font-size: 1rem;
    color: var(--tagline-green);
    letter-spacing: 0.8px;
    font-family: 'Quicksand', sans-serif;
    font-style: italic;
    user-select: none;
}

/* Forgot Password Modal */
#forgotPasswordModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);justify-content:center;align-items:center;z-index:9999;}
#forgotPasswordModal .modal-content{background:var(--card-gradient);padding:25px 30px;border-radius:15px;width:90%;max-width:400px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.08);position:relative;font-family:'Nunito',sans-serif;}
#forgotPasswordModal .modal-content h4{font-family:'Poppins',sans-serif;font-weight:700;color:var(--logoblue);margin-bottom:10px;}
#forgotPasswordModal .modal-content input{width:80%;padding:10px;border-radius:8px;border:1px solid #dedff0;font-size:14px;color:var(--dark);margin:5px 0;}
#forgotPasswordModal .modal-content button{padding:10px 20px;border:none;border-radius:30px;background:linear-gradient(to right,var(--primary),var(--secondary));color:white;font-weight:600;font-size:14px;cursor:pointer;transition:all 0.3s ease;margin-top:10px;}
#forgotPasswordModal .modal-content .close-btn{position:absolute;top:12px;right:12px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--primary);}
</style>
</head>
<body>
<div class="form-wrapper">
    <div class="card shadow-sm">
        <div class="card-body">
            <!-- <header>
                <div class="logo"><span class="blossom">🌸</span>Gyan Setuu<span class="blossom">🌸</span></div>
                <div class="tagline">From Villages To World Of Wisdom</div>
            </header> -->
            <header>
    <div class="logo">
        <span class="blossom">🌸</span>Gyan Setu<span class="blossom">🌸</span>
    </div>
    <div class="tagline">
        From Villages To World Of Wisdom
    </div>
</header>
            <h2>Sign In</h2>
            <form id="signinForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required maxlength="10">
                    <div class="username-helper">Format: Gyan + your 5 characters (e.g., Gyanabcde)</div>
                    <div class="error-message" id="usernameError"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-field">
                        <input type="password" class="form-control" id="password" required>
                        <i class="bi bi-eye-slash password-toggle" id="togglePassword"></i>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary" id="signinBtn" disabled>Sign In</button>
                <a href="#" class="forgot-password-link" onclick="forgotPassword()">Forgot password?</a>
            </form>
            <br/>
            <div class="text-center mt-4">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>

<!-- Forgot Password Modal -->
<div id="forgotPasswordModal">
    <div class="modal-content">
        <h4>Forgot Password</h4>
        <div id="step1">
            <p style="font-size:14px; color: var(--text); margin-bottom:10px;">Enter your registered mobile number</p>
            <input type="text" id="forgotMobile" placeholder="Mobile Number">
            <div id="forgotMessage" style="margin:8px 0; min-height:16px; font-size:13px;"></div>
            <button id="sendMobileBtn">Next</button>
        </div>
        <div id="step2" style="display:none;">
            <p style="font-size:14px; color: var(--text); margin-bottom:10px;" id="securityQuestion"></p>
            <input type="text" id="securityAnswer" placeholder="Answer">
            <!-- <input type="password" id="newPassword" placeholder="New Password"> -->
            <div id="resetMessage" style="margin:8px 0; min-height:16px; font-size:13px;"></div>
            <button id="resetPasswordBtn">Show Password</button>
        </div>
        <button class="close-btn" onclick="closeForgotModal()">&times;</button>
    </div>
</div>

<script>
const form = document.getElementById('signinForm');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const usernameError = document.getElementById('usernameError');
const passwordError = document.getElementById('passwordError');
const signinBtn = document.getElementById('signinBtn');
const togglePassword = document.getElementById('togglePassword');
let isUsernameValid = false, isPasswordValid = false;

// --- VALIDATION ---
function validateUsername(username){
    const usernameRegex = /^Gyan[a-zA-Z0-9]{5}$/;
    const trimmed = username.trim();
    if(trimmed.length === 0) return {isValid: false, errors: ['Username is required']};
    if(!usernameRegex.test(trimmed)) return {isValid: false, errors: ['Format: Gyan + 5 alphanumeric characters']};
    return {isValid: true, errors: []};
}

function validatePassword(password){
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
    if(password.length === 0) return {isValid: false, errors: ['Password is required']};
    if(!passwordRegex.test(password)) return {isValid: false, errors: ['Requires 8+ chars, Uppercase, Lowercase, and Number']};
    return {isValid: true, errors: []};
}

function updateFieldState(input, errorElement, validation){
    if(validation.isValid){
        input.classList.remove('is-invalid'); input.classList.add('is-valid');
        errorElement.textContent='';
    } else {
        input.classList.remove('is-valid'); input.classList.add('is-invalid');
        errorElement.textContent=validation.errors.join('. ');
    }
}

function updateSubmitButton(){ signinBtn.disabled = !(isUsernameValid && isPasswordValid); }

// --- LISTENERS ---
usernameInput.addEventListener('input', function(){
    const validation = validateUsername(this.value);
    isUsernameValid = validation.isValid;
    updateFieldState(this, usernameError, validation);
    updateSubmitButton();
});

passwordInput.addEventListener('input', function(){
    const validation = validatePassword(this.value);
    isPasswordValid = validation.isValid;
    updateFieldState(this, passwordError, validation);
    updateSubmitButton();
});

togglePassword.addEventListener('click', function(){
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    this.classList.toggle('bi-eye'); this.classList.toggle('bi-eye-slash');
});

// --- SUBMISSION ---
form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const loginData = { username: usernameInput.value.trim(), password: passwordInput.value };
    try {
        signinBtn.disabled = true;
        signinBtn.textContent = "Checking...";
        const response = await fetch('http://localhost:3000/signin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(loginData)
        });
        const data = await response.json();
        if (data.success) {
            localStorage.setItem('currentUser', JSON.stringify(data.user)); 
            window.location.href = 'index.html';
        } else {
            alert(data.message);
            signinBtn.disabled = false;
            signinBtn.textContent = "Sign In";
        }
    } catch (error) {
        alert('Server connection error.');
        signinBtn.disabled = false;
        signinBtn.textContent = "Sign In";
    }
});

// --- FORGOT PASSWORD MODAL ---
function forgotPassword() {
    document.getElementById('forgotPasswordModal').style.display = 'flex';
    document.getElementById('step1').style.display = 'block';
    document.getElementById('step2').style.display = 'none';
}

function closeForgotModal() {
    document.getElementById('forgotPasswordModal').style.display = 'none';
}

document.getElementById('sendMobileBtn').addEventListener('click', async () => {
    const mobile = document.getElementById('forgotMobile').value.trim();
    if (!mobile) return alert("Please enter mobile number");
    try {
        const res = await fetch('http://localhost:3000/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mobile })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('securityQuestion').textContent = data.security_question || data.question;
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        } else { alert(data.message); }
    } catch (error) { alert('Server error'); }
});

document.getElementById('resetPasswordBtn').addEventListener('click', async () => {
    const mobile = document.getElementById('forgotMobile').value.trim();
    const answer = document.getElementById('securityAnswer').value.trim();
    
    if (!answer) return alert("Please enter your answer");

    try {
        const res = await fetch('http://localhost:3000/verify-answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mobile: mobile, answer: answer }) // Matches server.js
        });
        
        const data = await res.json();
        
        if (data.success) {
            // Display the password to the user
            alert(`Verification successful! Your password is: ${data.password}`);
            closeForgotModal();
            
            // Optional: Clean up form
            document.getElementById('forgotMobile').value = "";
            document.getElementById('securityAnswer').value = "";
        } else { 
            alert(data.message); // Should say "Incorrect answer."
        }
    } catch (error) { 
        alert('Server error. Please try again later.'); 
    }
});
</script>
</body>
</html>
