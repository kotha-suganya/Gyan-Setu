<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Gyan Setu - Teacher Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=Nunito:wght@400;700&family=Poppins:wght@700&display=swap" rel="stylesheet" />
    <style>
        /* ... existing styles ... */
        :root { --primary: #6C63FF; --secondary: #FF6584; --accent: #57E2A0; --dark: #22223B; --text: #343459; --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); --shadow: 0 8px 24px rgba(0,0,0,0.08); --blossom-color: #FF69B4; --logoblue: #3B5998; }
        body { background: var(--bg-gradient); color: var(--text); font-family: 'Nunito', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .signin-container { max-width: 400px; width: 100%; background: #ffffff; border-radius: 25px; padding: 40px; box-shadow: var(--shadow); text-align: center; }
        .logo { font-family: 'Poppins', sans-serif; font-size: 2rem; font-weight: 700; color: var(--logoblue); margin-bottom: 20px; display: inline-flex; align-items: center; }
        .logo .blossom { font-size: 1.8rem; margin: 0 10px; color: var(--blossom-color); }
        h2 { font-family: 'Poppins', sans-serif; color: var(--dark); margin-bottom: 30px; font-size: 1.5rem; }
        .form-group { text-align: left; margin-bottom: 20px; width: 100%; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.9rem; color: var(--text); }
        .form-group input { width: 100%; padding: 14px 15px; border: 2px solid #eee; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        .btn { width: 100%; background: linear-gradient(to right, var(--primary), var(--accent)); color: white; border-radius: 30px; font-weight: bold; padding: 15px; cursor: pointer; border: none; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="signin-container">
    <div class="logo"><span class="blossom">🌸</span>Gyan Setu<span class="blossom">🌸</span></div>
    <h2>Teacher Sign In</h2>
    <form id="signinForm">
        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn">Sign In to Dashboard</button>
    </form>
</div>

<script>
document.getElementById('signinForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        // Updated to absolute URL for reliability
        const response = await fetch('http://localhost:3000/teacher-signin', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success) {
            // Store teacher info for use in the dashboard
            localStorage.setItem('teacherInfo', JSON.stringify(result.teacher));
            
            alert("Login Successful! Welcome " + result.teacher.fullname);
            
            // Redirect to the dashboard
            window.location.href = "teachindex.html"; 
        } else {
            alert(result.message);
        }
    } catch (error) {
        console.error("Login error:", error);
        alert("Connection failed. Ensure server.js is running.");
    }
});
</script>
</body>
</html>
