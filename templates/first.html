<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Gyan Setu - Select Role</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=Nunito:wght@400;700&family=Poppins:wght@700&display=swap" rel="stylesheet" />
    
    <style>
        :root {
            --primary: #6C63FF;
            --secondary: #FF6584;
            --accent: #57E2A0;
            --soft: #FFE6E6;
            --dark: #22223B;
            --text: #343459;
            --video-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --shadow: 0 8px 24px rgba(0,0,0,0.15);
            --blossom-color: #FF69B4;
            --logoblue: #3B5998;
            --tagline-green: #2E8B57;
        }

        body {
            background: var(--video-gradient);
            color: var(--text);
            font-family: 'Nunito', 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        
        .background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        header {
            margin-bottom: 40px;
            z-index: 1;
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--logoblue);
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            animation: moveUpDown 3s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }

        .logo .blossom {
            font-size: 2.8rem;
            margin: 0 15px;
            color: var(--blossom-color);
            animation: blossomPulse 2.5s infinite ease-in-out;
        }

        @keyframes blossomPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes moveUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .selection-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 1;
            max-width: 900px;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            width: 280px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow);
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .role-card:hover {
            transform: translateY(-15px);
            border-color: var(--primary);
            box-shadow: 0 15px 35px rgba(108, 99, 255, 0.2);
        }

        .role-card i {
            font-size: 4rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role-card h2 {
            font-family: 'Poppins', sans-serif;
            margin: 10px 0;
            font-size: 1.8rem;
            color: var(--dark);
        }

        .role-card p {
            font-size: 1rem;
            color: #666;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            .logo { font-size: 2.2rem; }
            .logo .blossom { font-size: 1.8rem; }
            .selection-container { flex-direction: column; }
        }
    </style>
</head>
<body>

</video> -->

<header>
    <div class="logo"><span class="blossom">🌸</span>Gyan Setu<span class="blossom">🌸</span></div>
</header>

<div class="selection-container">
    <a href="main.html" class="role-card">
        <i class="fas fa-user-graduate"></i>
        <h2>Student</h2>
        <p>Access your lessons, quizzes, and wisdom world.</p>
    </a>

    <a href="teachermain.html" class="role-card">
        <i class="fas fa-chalkboard-teacher"></i>
        <h2>Teacher</h2>
        <p>Manage classrooms and share knowledge with students.</p>
    </a>
</div>

</body>
</html>
