<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <title>StoryBot: Ask Me Anything!</title>
    <style>
        /* Basic CSS for styling */
        :root {
            --primary: #6C63FF;
            --secondary: #FF6584;
            --accent: #57E2A0;
            --soft: #FFE6E6;
            --dark: #22223B;
            --text: #343459;
            --video-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --card-gradient: linear-gradient(120deg, #FCF6FF 60%, #D6FCFF 100%);
            --shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        body {
            font-family: 'Nunito', 'Quicksand', sans-serif;
            background: var(--video-gradient);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 80vh; /* or desired height */
            max-width: 700px;
        }
        #response-area {
            flex-grow: 1;
            overflow-y: auto;
            border: 1.5px solid var(--primary);
            border-radius: 15px;
            padding: 150px;
            background-color: var(--soft);
            box-shadow: var(--shadow);
            margin-bottom: 15px;
        }
        .input-area {
            position: sticky;
            bottom: 0;
            display: flex;
            gap: 10px;
            background: var(--card-gradient);
            padding: 12px 20px;
            border: 1px solid #dedff0;
            border-radius: 25px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .input-area input[type="text"] {
            flex-grow: 1;
            padding: 12px 20px;
            font-size: 1.1em;
            border: none;
            outline: none;
            border-radius: 25px;
            background: var(--soft);
            color: var(--dark);
        }
        .input-area button {
            padding: 12px 25px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .input-area button:hover {
            background: linear-gradient(to left, var(--secondary), var(--primary));
        }
        h1 {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            background-clip: text;
            color: transparent;
            font-family: 'Quicksand', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }
        .controls-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-bottom: 24px;
        }
        .controls-area label {
            color: var(--dark);
        }
        .controls-area select {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #dedff0;
            font-size: 0.95em;
            background-color: var(--soft);
            outline: none;
            cursor: pointer;
            color: var(--dark);
        }
        input[type="text"] {
            flex-grow: 1;
            border: none;
            padding: 12px 20px;
            font-size: 1em;
            background: transparent;
            outline: none;
            color: var(--dark);
        }
        button {
            background: linear-gradient(to right, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 0 25px 25px 0;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        button:hover {
            background: linear-gradient(to left, var(--secondary), var(--primary));
        }
        .user-question {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .story-explanation {
            background: var(--soft);
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid var(--primary);
            color: var(--dark);
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .error-message {
            color: var(--secondary);
            font-weight: bold;
            margin-top: 15px;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* NEW: Back button styling */
.back-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 1.18rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
    position: absolute;
    top: 20px;
    left: 20px;
}
.back-btn:hover {
    background: var(--secondary);
}
    </style>
</head>

        <h1>StoryBot: Ask Me Anything!</h1>
        <p>Type your question below, and I'll explain it in a short, engaging story.</p>
        <div class="controls-area">

            <select id="genreSelect">

                <option value="sci-fi">Sci-Fi</option>
                <option value="mystery">Mystery</option>
                <option value="adventure">Adventure</option>
                <option value="historical">Historical</option>
                <option value="humorous">Humorous</option>
            </select>
            <label for="ageSelect">Age Group:</label>
            <select id="ageSelect">
                <option value="all_ages">All Ages</option>
                <option value="kids">Kids</option>
                <option value="teens">Teens</option>
                <option value="adults">Adults</option>
            </select>
            <label for="lengthSelect">Length:</label>
            <select id="lengthSelect">
                <option value="short">Short (4-5 sentences)</option>
                <option value="medium">Medium (8-10 sentences)</option>
                <option value="long">Long (15-20 sentences)</option>
            </select>
        </div>
        <div id="response-area">
        </div>
        <div class="input-area">
            <input type="text" id="questionInput" placeholder="e.g., Ask your doubt">
            <button onclick="askQuestion()">Ask StoryBot</button>
        </div>
        <div class="loading-spinner" id="loadingSpinner"></div>
    </div>

        function renderChatHistory() {
            responseArea.innerHTML = '';
            chatHistory.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = msg.sender === 'user' ? 'user-question' : 
                    (msg.sender === 'error' ? 'error-message' : 'story-explanation');
                msgDiv.textContent = msg.content;
                responseArea.appendChild(msgDiv);
            });
        }
        
        async function askQuestion() {
            const question = questionInput.value.trim();
            if (!question) {
                alert('Please enter a question!');
                return;
            }
        
            // Check for hardcoded responses first
            // const hardcodedResponse = inbuiltResponses[question.toLowerCase()];
            // if (hardcodedResponse) {
            //     chatHistory.push({ sender: 'bot', content: hardcodedResponse });
            //     renderChatHistory();
            //     questionInput.value = ''; // Clear the input
            //     return;
            // }
        
            // Get the subject from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const subject = urlParams.get('subject');
        
            const selectedGenre = genreSelect.value;
            const selectedAgeGroup = ageSelect.value;
            const selectedLength = lengthSelect.value;
            loadingSpinner.style.display = 'block';
        
            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        genre: selectedGenre,
                        age_group: selectedAgeGroup,
                        length: selectedLength,
                        subject: subject // Pass the subject to the backend
                    })
                });
        
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
        
                const data = await response.json();
        
                if (data.error) {
                    throw new Error(data.error);
                }
        
                // Add user question to history
                chatHistory.push({ sender: 'user', content: question });
                // Add bot response to history
                chatHistory.push({ sender: 'bot', content: data.response });
        
            } catch (error) {
                console.error('Fetch Error:', error);
                chatHistory.push({ sender: 'error', content: 'Apologies, StoryBot is currently experiencing issues. Please try again later.' });
            } finally {
                loadingSpinner.style.display = 'none';
                renderChatHistory();
                questionInput.value = '';
                responseArea.scrollTop = responseArea.scrollHeight;
            }
        }
        
        // Submit on Enter key
        questionInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                askQuestion();
            }
        });
